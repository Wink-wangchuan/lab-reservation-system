<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>无法连接服务器</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: #f4f6fb;
      color: #1f2a44;
    }
    .card {
      text-align: center;
      padding: 32px 40px;
      background: #fff;
      border: 1px solid #e3e8f2;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(31, 42, 68, 0.08);
    }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { color: #6b778c; font-size: 14px; margin: 0 0 18px; }
    button {
      height: 38px;
      padding: 0 24px;
      border: none;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #5b8cff, #7a6cff);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>无法连接服务器</h1>
    <p id="detail">请确认已接入 tailnet，并检查服务器是否在线。</p>
    <button id="retry">重新连接</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    if (params.get('url')) {
      document.getElementById('detail').textContent = `目标地址：${params.get('url')}`
    }
    document.getElementById('retry').addEventListener('click', () => window.labwise?.retry())
  </script>
</body>
</html>
