# ============================================================
# 智慧实验室预约管理系统 - 主配置文件
# 默认激活 dev 环境；通过启动参数 -Dspring.profiles.active=prod 切换
# ============================================================
spring:
  application:
    name: lab-reservation-system
  profiles:
    active: dev

  # 时间序列化统一为字符串，避免 LocalDateTime 默认数组/时间戳导致的显示异常
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mvc:
    # 路径匹配策略保持默认 ant_path_matcher（与 Knife4j 兼容）
    throw-exception-if-no-handler-found: true
    async:
      # AI 助手是流式长连接：Tomcat 异步请求超时默认 30s，会把长回答硬掐断，此处显式放宽
      request-timeout: 400s

  task:
    scheduling:
      pool:
        # 定时任务默认只有 1 个线程，过期预约推进 / 签到推进 / 操作日志清理会互相排队
        size: 3

  web:
    resources:
      add-mappings: true

  # 数据库版本迁移：既有库从 4.5 基线接管，之后按 db/migration/V*.sql 顺序自动执行
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 4.5
    baseline-description: "baseline before v4.6"
    locations: classpath:db/migration
    # 手工执行过 sql/upgrade_*.sql 的库校验和可能对不上，关闭校验只按版本号推进
    validate-on-migrate: false

server:
  port: 8080
  servlet:
    context-path: /

# ============================================================
# MyBatis-Plus 配置
# ============================================================
mybatis-plus:
  # 实体别名包（Mapper XML 中可直接写实体类名）
  type-aliases-package: com.lab.reservation.entity
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 关闭二级缓存以外的下划线转驼峰（默认已开启），显示打印 SQL
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：ASSIGN_ID（雪花算法，适配高并发）
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# Knife4j / OpenAPI 文档
# ============================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: default
      packages-to-scan: com.lab.reservation.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
  doc:
    title: 智慧实验室预约管理系统 API
    description: 智慧实验室预约管理系统接口文档（RESTful）
    version: 1.0.0
    contact:
      name: LabWise

# ============================================================
# AI 助手（OpenAI 兼容协议）
# 令牌只从环境变量注入（服务器 systemd 单元的 EnvironmentFile），不落仓库、不下发前端
# ============================================================
ai:
  base-url: ${AI_BASE_URL:https://zhenze-guangzhou8.cmecloud.cn/api/coding/v1}
  token: ${AI_TOKEN:}
  model: ${AI_MODEL:MiniMax-M2.5}
  timeout-seconds: ${AI_TIMEOUT:60}
  max-history: 20
  rate-limit-per-minute: 20

# ============================================================
# 安全相关
# ============================================================
cors:
  # 跨域来源白名单（逗号分隔）。禁止使用 *，否则配合 allowCredentials 任意站点均可跨域调用
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5173}

auth:
  captcha:
    # 是否在接口响应中回传验证码。默认关闭（验证码即登录凭证，回传等于认证绕过）
    expose-code: ${CAPTCHA_EXPOSE_CODE:false}

# ============================================================
# 和风天气（API Key 只从环境变量注入，绝不下发前端）
# ============================================================
weather:
  host: ${QWEATHER_HOST:https://na5u9xkk3k.re.qweatherapi.com}
  key: ${QWEATHER_KEY:}
  # 未取到定位时的默认位置：广州
  default-lat: 23.1291
  default-lon: 113.2644
  # 实况缓存 10 分钟，避免刷新页面反复消耗接口配额
  cache-seconds: 600

# ============================================================
# 客户端更新（exe / apk 由服务器托管）
# 清单与安装包放在后端工作目录下，默认 updates/
# ============================================================
app:
  update:
    dir: ${APP_UPDATE_DIR:./updates}
    manifest: ${APP_UPDATE_MANIFEST:manifest.json}

# ============================================================
# 可观测性（Prometheus 抓取 /actuator/prometheus）
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: lab-reservation-system

# ============================================================
# 历史数据归档（定时把过期完成的预约与旧操作日志移到归档表）
# 见下方 lab.archive 配置
# ============================================================

# ============================================================
# 操作日志保留策略（每天凌晨清理过期记录，防止表无限膨胀）
# ============================================================
oper-log:
  retain-days: ${OPER_LOG_RETAIN_DAYS:90}

# ============================================================
# 定时任务开关
# 每个任务独立开关，便于按环境裁剪：关闭后任务仍被调度但立即返回，
# 不占用数据库连接，也不需要改代码或注释 @Scheduled。
# ============================================================
lab:
  # 历史数据归档：过期完成的预约与旧操作日志移到归档表，主表保持轻量
  archive:
    enabled: ${ARCHIVE_ENABLED:true}
    reservation-years: ${ARCHIVE_RESERVATION_YEARS:2}
    oper-log-days: ${ARCHIVE_OPER_LOG_DAYS:60}
  schedule:
    # 已通过预约到点自动置为已完成
    auto-complete-reservation: ${SCHEDULE_AUTO_COMPLETE:true}
    # 开始前 30 分钟站内提醒
    remind-reservation: ${SCHEDULE_REMIND:true}
    # 签到单超时归档 + 爽约计数
    auto-close-checkin: ${SCHEDULE_AUTO_CLOSE_CHECKIN:true}
    # 候补队列自动递补
    promote-waitlist: ${SCHEDULE_PROMOTE_WAITLIST:true}
    # 操作日志按保留天数清理
    purge-oper-log: ${SCHEDULE_PURGE_OPER_LOG:true}

# ============================================================
# 日志级别
# ============================================================
logging:
  level:
    com.lab.reservation: debug
    org.springframework.security: warn